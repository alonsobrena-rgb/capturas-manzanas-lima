name: panos-streetview
on:
  push:
    paths: ['panos/puntos.csv', 'panos/consultar.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar metadata de Street View
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python3 panos/consultar.py
      - name: Guardar resultado en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add panos/panos.csv
          git commit -m "panos.csv actualizado" || echo "sin cambios"
          git push
